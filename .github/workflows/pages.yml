name: Deploy JTJ Software to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate static site
        run: |
          set -eu
          test -f public/index.html
          test -f public/contact/index.html
          test -f public/legal/index.html
          test -f public/pt/index.html
          test -f public/pt/contacto/index.html
          test -f public/pt/legal/index.html
          test -f public/en/index.html
          test -f public/en/contact/index.html
          test -f public/en/legal/index.html
          test -f public/contacto/index.html
          test -f public/assets/styles.css
          test -f public/assets/theme.js
          test -f public/CNAME
          test -f public/robots.txt
          test -f public/sitemap.xml
          test "$(cat public/CNAME)" = "jtjsoftware.com"
          if grep -R -n -E '(href|src)="/' public --include='*.html'; then
            echo "Root-relative URLs are not compatible with project Pages sites."
            exit 1
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
