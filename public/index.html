<!doctype html>
<html lang="en" class="no-js" data-language-gateway>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2efe8">
    <meta name="description" content="Choose the English or Portuguese version of the JTJ Software website.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jtjsoftware.com/">
    <meta property="og:site_name" content="JTJ Software">
    <meta property="og:title" content="Software built around your goals. — JTJ Software">
    <meta property="og:description" content="Custom software, digital products, integrations and product evolution.">
    <meta property="og:image" content="https://jtjsoftware.com/assets/jtj-logo-dark-bg.png">
    <meta name="twitter:card" content="summary">
    <title>Choose language — JTJ Software</title>
    <link rel="canonical" href="https://jtjsoftware.com/">
    <link rel="alternate" hreflang="en" href="https://jtjsoftware.com/en/">
    <link rel="alternate" hreflang="pt-PT" href="https://jtjsoftware.com/pt/">
    <link rel="alternate" hreflang="x-default" href="https://jtjsoftware.com/">
    <link rel="icon" href="./assets/favicon-48.png" type="image/png" sizes="48x48">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" sizes="180x180">
    <!-- Apply the saved theme before first paint; interactions load with defer. -->
    <script>
      (function () {
        var root = document.documentElement, preference = "auto";
        try {
          var saved = localStorage.getItem("jtj-theme");
          if (saved === "light" || saved === "dark") preference = saved;
        } catch (_) {}
        var theme = preference === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : preference;
        root.dataset.theme = theme;
        root.dataset.themePreference = preference;
        root.style.colorScheme = theme;
        root.classList.replace("no-js", "js");
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111417" : "#f2efe8";
      })();
    </script>
    <script src="./assets/theme.js" defer></script>
    <script src="./assets/language.js"></script>
    <link rel="stylesheet" href="./assets/styles.css">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "JTJ Software",
        "url": "https://jtjsoftware.com/",
        "logo": "https://jtjsoftware.com/assets/jtj-logo-dark-bg.png",
        "sameAs": [
          "https://github.com/JTJ-Software/jtj-software.github.io"
        ]
      }
    </script>
  </head>
  <body class="language-gateway-page">
    <main class="language-gateway shell" id="content">
      <div class="language-gateway-brand" aria-hidden="true">
        <img src="./assets/jtj-logo-light-bg.webp" srcset="./assets/jtj-logo-light-bg-360.webp 360w, ./assets/jtj-logo-light-bg-480.webp 480w, ./assets/jtj-logo-light-bg.webp 715w" sizes="(max-width: 1160px) 360px, 460px" alt="" width="715" height="715">
      </div>
      <div class="language-gateway-copy">
        <p class="section-kicker">JTJ Software · Portugal</p>
        <h1>Choose your language.</h1>
        <p>Escolha o seu idioma.</p>
        <nav class="language-gateway-options" aria-label="Choose language / Escolher idioma">
          <a href="./en/" hreflang="en" lang="en" data-language="en">
            <span>EN</span>
            <strong>English</strong>
            <span aria-hidden="true">↗</span>
          </a>
          <a href="./pt/" hreflang="pt-PT" lang="pt-PT" data-language="pt">
            <span>PT</span>
            <strong>Português</strong>
            <span aria-hidden="true">↗</span>
          </a>
        </nav>
        <noscript>
          <p class="language-gateway-note">Automatic language selection requires JavaScript. Choose a language above.</p>
        </noscript>
      </div>
    </main>
  </body>
</html>
